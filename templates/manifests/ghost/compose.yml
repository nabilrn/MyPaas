services:
  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2368:2368"
    environment:
      url: ${GHOST_URL:?GHOST_URL is required}
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:?GHOST_DB_PASSWORD is required}
      database__connection__database: ghost
    volumes:
      - ghost-content:/var/lib/ghost/content
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:?GHOST_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_ROOT_PASSWORD:?GHOST_DB_ROOT_PASSWORD is required}
    volumes:
      - ghost-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ghost-content:
  ghost-mysql:
