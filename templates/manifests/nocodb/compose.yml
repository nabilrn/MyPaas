services:
  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NC_DB: pg://db:5432?u=nocodb&p=${NOCODB_DB_PASSWORD:?NOCODB_DB_PASSWORD is required}&d=nocodb
      NC_REDIS_URL: redis://redis:6379
      NC_DISABLE_MUX: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nocodb-data:/usr/app/data
  worker:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    environment:
      NC_DB: pg://db:5432?u=nocodb&p=${NOCODB_DB_PASSWORD:?NOCODB_DB_PASSWORD is required}&d=nocodb
      NC_REDIS_URL: redis://redis:6379
      NC_WORKER_CONTAINER: "true"
    depends_on:
      nocodb:
        condition: service_started
    volumes:
      - nocodb-data:/usr/app/data
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${NOCODB_DB_PASSWORD:?NOCODB_DB_PASSWORD is required}
    volumes:
      - nocodb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - nocodb-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nocodb-data:
  nocodb-postgres:
  nocodb-redis:
