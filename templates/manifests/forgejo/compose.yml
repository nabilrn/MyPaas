services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:?FORGEJO_DOMAIN is required}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:?FORGEJO_ROOT_URL is required}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN:?FORGEJO_DOMAIN is required}
      FORGEJO__server__DISABLE_SSH: "true"
    volumes:
      - forgejo-data:/data

volumes:
  forgejo-data:
