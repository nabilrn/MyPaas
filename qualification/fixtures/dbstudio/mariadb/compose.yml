services:
  app:
    image: nginx:1.27-alpine
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: appdb
      MARIADB_USER: app
      MARIADB_PASSWORD: fixture-only-password
      MARIADB_ROOT_PASSWORD: fixture-only-root-password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uapp -pfixture-only-password --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - data:/var/lib/mysql

volumes:
  data:
