services:
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
    expose:
      - "9001"
    environment:
      MINIO_ROOT_USER: compatibility-admin
      MINIO_ROOT_PASSWORD: compatibility-password-change-me
    volumes:
      - minio-data:/data

volumes:
  minio-data:
