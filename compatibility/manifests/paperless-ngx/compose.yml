services:
  broker:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - paperless-redis:/data
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: compatibility-password
    volumes:
      - paperless-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 10
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: compatibility-password
      PAPERLESS_SECRET_KEY: compatibility-only-paperless-secret-change-me
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_TIME_ZONE: Asia/Jakarta
      PAPERLESS_BIND_ADDR: 0.0.0.0
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3).read(1)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  paperless-redis:
  paperless-postgres:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
