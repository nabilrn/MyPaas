services:
  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: production
      url: http://localhost:2368
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: compatibility-password
      database__connection__database: ghost
    volumes:
      - ghost-content:/var/lib/ghost/content
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2368/ghost/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
  db:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: compatibility-password
      MYSQL_ROOT_PASSWORD: compatibility-root-password
    volumes:
      - ghost-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pcompatibility-root-password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  ghost-content:
  ghost-mysql:
