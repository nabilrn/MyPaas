name: Temporary qualification unit-test CI patch

on:
  push:
    branches:
      - ci/run-qualification-unit-tests

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CI qualification tests
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = "      - name: Script regression tests\n        run: python3 -m unittest discover -s scripts -p '*_test.py'\n      - name: Production Compose config\n"
          new = "      - name: Script regression tests\n        run: python3 -m unittest discover -s scripts -p '*_test.py'\n      - name: Qualification harness unit tests\n        run: PYTHONPATH=benchmarks python3 -m unittest test_beta_resilience test_dbstudio_compose_smoke test_fixture_ref\n      - name: Production Compose config\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one CI insertion point, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Execute qualification unit tests
        run: PYTHONPATH=benchmarks python3 -m unittest test_beta_resilience test_dbstudio_compose_smoke test_fixture_ref
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci: execute qualification harness unit tests"
          git push origin HEAD:ci/run-qualification-unit-tests
