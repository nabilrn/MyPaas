name: Publish Release

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  publish:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'release/v') && contains(github.event.pull_request.title, '[publish-release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release request
        id: release
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag="${RELEASE_BRANCH#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag derived from branch: $tag" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release source SHA: $RELEASE_SHA" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/${tag#v}.md" >> "$GITHUB_OUTPUT"

      - name: Verify exact release SHA passed CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=pull_request&per_page=100" \
            > /tmp/runs.json
          python3 - <<'PY'
          import json
          import os

          target = os.environ["TARGET_SHA"]
          runs = json.load(open("/tmp/runs.json", encoding="utf-8")).get("workflow_runs", [])
          matches = [
              run for run in runs
              if run.get("name") == "CI" and run.get("head_sha") == target
          ]
          if not matches:
              raise SystemExit(f"no CI run found for release SHA {target}")
          latest = max(matches, key=lambda run: run.get("created_at", ""))
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              raise SystemExit(
                  f"CI is not green for {target}: "
                  f"status={latest.get('status')} conclusion={latest.get('conclusion')}"
              )
          print(f"verified CI run {latest.get('id')} completed/success for {target}")
          PY

      - name: Checkout exact CI-tested release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release notes
        shell: bash
        env:
          NOTES_FILE: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          test -f "$NOTES_FILE" || {
            echo "Missing release notes: $NOTES_FILE" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.sha }}"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          NOTES_FILE: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "MyPaas $TAG" \
            --notes-file "$NOTES_FILE" \
            "${release_flags[@]}"
