name: Publish Beta Candidate Images

on:
  push:
    branches:
      - "infra/publish-beta-candidate-images"

env:
  REGISTRY: ghcr.io
  TARGET_SHA: edea8615d75f8e032bfb66bf430ab598b05876b2

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API candidate image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ env.TARGET_SHA }}

      - name: Build and push Dashboard candidate image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:${{ env.TARGET_SHA }}
