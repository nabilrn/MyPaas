name: Temporary dashboard live polish
on:
  push:
    branches: [agent/dashboard-live-telemetry-polish]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Apply product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('frontend/src/routes/projects/+page.svelte')
          s=page.read_text()
          s=s.replace('ExternalLink, FolderGit2, GitBranch, LoaderCircle, Package, Play, Plus, RefreshCw, Rocket, Search, Square, TriangleAlert, X','ExternalLink, FolderGit2, GitBranch, LoaderCircle, Package, Play, Plus, Rocket, Search, Square, TriangleAlert, X')
          s=s.replace("\tlet lastRefreshedAt: Date | null = null;\n",'')
          s=s.replace("\t$: dashboardRefreshing = loading || projectsInFlight || hostStatsInFlight;\n\t$: syncLabel = error ? 'Refresh needs attention' : dashboardRefreshing ? 'Refreshing' : 'Up to date';\n\t$: syncDotClass = error ? 'bg-amber-500' : dashboardRefreshing ? 'bg-gray-400 animate-pulse' : 'bg-gray-500 dark:bg-gray-400';","\t$: syncLabel = error ? 'Updates delayed' : loading ? 'Connecting' : 'Live updates';\n\t$: syncDotClass = error ? 'bg-amber-500' : loading ? 'bg-gray-400 animate-pulse' : 'bg-emerald-500 dark:bg-emerald-400';")
          s=s.replace("\t\t\tlastRefreshedAt = new Date();\n",'')
          s=s.replace("\n\tfunction formatRefreshTime(value: Date) {\n\t\treturn value.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });\n\t}\n",'\n')
          old='''\t\t<p class="inline-flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400" aria-live="polite">\n\t\t\t<span class={`status-dot ${syncDotClass}`}></span>\n\t\t\t{syncLabel}{lastRefreshedAt ? ` · ${formatRefreshTime(lastRefreshedAt)}` : ''}\n\t\t\t<span class="text-gray-400 dark:text-gray-500">· {projects.length} project{projects.length === 1 ? '' : 's'}</span>\n\t\t</p>\n\t\t<div class="flex items-center gap-2">\n\t\t\t<ActionButton variant="secondary" loading={dashboardRefreshing} loadingLabel="Refreshing" on:click={() => refreshDashboardData()}>\n\t\t\t\t<RefreshCw slot="icon" class="h-4 w-4" />\n\t\t\t\tRefresh\n\t\t\t</ActionButton>\n\t\t\t<ActionLink href="/projects/new" variant="primary">'''
          new='''\t\t<p class="inline-flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400" aria-live="polite">\n\t\t\t<span class={`status-dot ${syncDotClass}`}></span>\n\t\t\t<span>{syncLabel}</span>\n\t\t\t<span class="text-gray-400 dark:text-gray-500">· {projects.length} project{projects.length === 1 ? '' : 's'}</span>\n\t\t</p>\n\t\t<div class="flex items-center gap-2">\n\t\t\t<ActionLink href="/projects/new" variant="primary">'''
          assert old in s
          page.write_text(s.replace(old,new))

          p=Path('frontend/src/lib/utils/host-telemetry.ts'); s=p.read_text()
          old='''\tconst observedSpan = Math.max(0, rawMax - rawMin);\n\tconst minimumSpan = hardMax !== null ? Math.max(4, hardMax * 0.04) : Math.max(1, rawMax * 0.05);\n\tconst desiredSpan = Math.max(minimumSpan, observedSpan * 1.5);\n\tconst center = (rawMin + rawMax) / 2;\n\tlet min = center - desiredSpan / 2;\n\tlet max = center + desiredSpan / 2;\n\n\tif (min < 0) {\n\t\tmax -= min;\n\t\tmin = 0;\n\t}\n\tif (hardMax !== null && max > hardMax) {\n\t\tmin -= max - hardMax;\n\t\tmax = hardMax;\n\t\tif (min < 0) min = 0;\n\t}\n'''
          new='''\tconst observedSpan = Math.max(0, rawMax - rawMin);\n\tconst minimumSpan = hardMax !== null\n\t\t? rawMax <= 1\n\t\t\t? 0.25\n\t\t\t: rawMax <= 5\n\t\t\t\t? 1\n\t\t\t\t: Math.max(2, hardMax * 0.02)\n\t\t: Math.max(1, rawMax * 0.05);\n\tconst desiredSpan = Math.max(minimumSpan, observedSpan * (hardMax !== null ? 1.6 : 1.5));\n\tconst center = (rawMin + rawMax) / 2;\n\tlet min = center - desiredSpan / 2;\n\tlet max = center + desiredSpan / 2;\n\n\tif (rawMin <= desiredSpan * 0.2 || min < 0) {\n\t\tmin = 0;\n\t\tmax = Math.max(desiredSpan, rawMax * 1.15);\n\t}\n\tif (hardMax !== null && hardMax - rawMax <= desiredSpan * 0.25) {\n\t\tmax = hardMax;\n\t\tmin = Math.max(0, hardMax - desiredSpan);\n\t} else if (hardMax !== null && max > hardMax) {\n\t\tmin -= max - hardMax;\n\t\tmax = hardMax;\n\t\tif (min < 0) min = 0;\n\t}\n'''
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('frontend/src/lib/utils/host-telemetry.test.ts'); s=p.read_text()
          s=s.replace('expect(domain.max - domain.min).toBeCloseTo(4, 5);','expect(domain.max - domain.min).toBeCloseTo(2, 5);',1)
          s=s.replace('expect(low.max).toBeCloseTo(4, 5);','expect(low.max).toBeCloseTo(0.64, 5);')
          marker="\tit('keeps adaptive percentage domains inside physical bounds', () => {"
          extra="\tit('magnifies very small non-zero utilization without inventing movement', () => {\n\t\tconst domain = deriveAdaptiveMetricDomain([0.82, 0.86, 0.9], 100);\n\t\texpect(domain.min).toBeGreaterThan(0);\n\t\texpect(domain.max).toBeGreaterThanOrEqual(0.9);\n\t\texpect(domain.max - domain.min).toBeCloseTo(0.25, 5);\n\t});\n\n"
          assert marker in s
          p.write_text(s.replace(marker,extra+marker))

          p=Path('frontend/src/lib/components/CapacityMetricChart.svelte'); s=p.read_text()
          for a,b in {
            'fill-gray-400/[0.035] dark:fill-gray-300/[0.05]':'fill-gray-400/[0.07] dark:fill-gray-300/[0.08]',
            'fill-emerald-400/[0.035] dark:fill-emerald-300/[0.05]':'fill-emerald-400/[0.07] dark:fill-emerald-300/[0.08]',
            'fill-sky-400/[0.035] dark:fill-sky-300/[0.05]':'fill-sky-400/[0.07] dark:fill-sky-300/[0.08]',
            'fill-amber-400/[0.03] dark:fill-amber-300/[0.045]':'fill-amber-400/[0.06] dark:fill-amber-300/[0.07]',
            'fill-violet-400/[0.035] dark:fill-violet-300/[0.05]':'fill-violet-400/[0.07] dark:fill-violet-300/[0.08]',
            'stroke-width="1.2"':'stroke-width="1.45"'}.items():
              assert a in s; s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run
          pnpm check
          pnpm build
      - name: Commit product patch
        run: |
          rm .github/workflows/tmp-dashboard-live-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: calm live dashboard telemetry"
          git push
