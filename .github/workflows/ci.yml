name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare SvelteKit types
        run: pnpm exec svelte-kit sync
      - name: Unit tests
        run: pnpm test --run
      - name: Type and Svelte checks
        run: pnpm check
      - name: Production build
        run: pnpm build

  scripts:
    name: Deployment script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/*.sh
      - name: Script regression tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Benchmark harness unit tests
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Production Compose config
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config >/dev/null
