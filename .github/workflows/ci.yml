name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare SvelteKit types
        run: pnpm exec svelte-kit sync
      - name: Unit tests
        run: pnpm test --run
      - name: Type and Svelte checks
        run: pnpm check
      - name: Production build
        run: pnpm build

  scripts:
    name: Deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py benchmarks/*.py
      - name: Script regression tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Production Compose config
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config >/dev/null

  podman:
    name: Podman compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker explicit network-alias contract
        run: |
          set -euo pipefail
          source_network=mypaas-ci-docker-source
          routing_network=mypaas-ci-docker-routing
          target=mypaas-ci-docker-alias-target
          cleanup() {
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$routing_network" >/dev/null 2>&1 || true
            docker network rm "$source_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$source_network" >/dev/null
          docker network create "$routing_network" >/dev/null
          docker run -d \
            --name "$target" \
            --network "$source_network" \
            alpine:3.20 sleep 300 >/dev/null
          docker network connect \
            --alias mypaas-port-18080 \
            "$routing_network" \
            "$target"

          ready=false
          for _ in $(seq 1 20); do
            if docker run --rm --network "$routing_network" alpine:3.20 \
              ping -c 1 -W 1 mypaas-port-18080 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != "true" ]]; then
            docker inspect "$target"
            docker network inspect "$routing_network"
            exit 1
          fi

      - name: Install rootful Podman socket
        run: bash scripts/ci_setup_rootful_podman.sh

      - name: Verify Docker CLI is backed by selected Podman
        run: |
          set -euo pipefail
          podman_bin="$(cat /tmp/mypaas-podman-bin)"
          conmon_bin="$(cat /tmp/mypaas-conmon-bin)"
          crun_bin="$(cat /tmp/mypaas-crun-bin)"
          clean_path="$(dirname "$podman_bin"):$(dirname "$conmon_bin"):$(dirname "$crun_bin"):/usr/bin:/usr/sbin:/bin:/sbin"
          clean_env=(env PATH="$clean_path" HOME=/root XDG_RUNTIME_DIR=/run/user/0 CONTAINERS_CONF_OVERRIDE=/tmp/mypaas-containers.conf)
          expected="$(sudo "${clean_env[@]}" "$podman_bin" version --format '{{.Client.Version}}')"
          actual="$(sudo docker version --format '{{.Server.Version}}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Docker compatibility socket server version $actual does not match selected Podman $expected" >&2
            sudo docker version >&2 || true
            sudo "${clean_env[@]}" "$podman_bin" version >&2 || true
            exit 1
          fi
          conmon_path="$(sudo "${clean_env[@]}" "$podman_bin" info --format '{{.Host.Conmon.Path}}')"
          runtime_path="$(sudo "${clean_env[@]}" "$podman_bin" info --format '{{.Host.OCIRuntime.Path}}')"
          test "$conmon_path" = "$conmon_bin"
          test "$runtime_path" = "$crun_bin"
          sudo docker version | tee /tmp/mypaas-docker-version.txt
          grep -q 'Podman Engine' /tmp/mypaas-docker-version.txt
          sudo docker compose version

      - name: Run MyPaaS Podman compatibility smoke
        run: sudo -E env PATH=/usr/bin:/usr/sbin:/bin:/sbin HOME=/root XDG_RUNTIME_DIR=/run/user/0 bash scripts/podman_compat_smoke.sh
