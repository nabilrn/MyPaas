name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")
          frontend_only=false
          if (( ${#changed_files[@]} > 0 )); then
            frontend_only=true
            for path in "${changed_files[@]}"; do
              if [[ "$path" != frontend/* ]]; then
                frontend_only=false
                break
              fi
            done
          fi

          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"
          echo "frontend_only=$frontend_only" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.frontend_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...

  frontend:
    name: Frontend checks
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare SvelteKit types
        run: pnpm exec svelte-kit sync
      - name: Unit tests
        run: pnpm test --run
      - name: Type and Svelte checks
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Cross-browser workspace geometry
        run: pnpm exec playwright test --config=playwright.config.js workspace-geometry.spec.js

  scripts:
    name: Deployment checks
    needs: changes
    if: needs.changes.outputs.frontend_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py benchmarks/*.py
      - name: Script regression tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Production Compose config
        run: docker compose -f docker-compose.prod.yml --env-file .env.example config >/dev/null

  podman:
    name: Podman compatibility gate
    needs: changes
    if: needs.changes.outputs.frontend_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker explicit network-alias contract
        run: |
          set -euo pipefail
          source_network=mypaas-ci-docker-source
          routing_network=mypaas-ci-docker-routing
          target=mypaas-ci-docker-alias-target
          cleanup() {
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$routing_network" >/dev/null 2>&1 || true
            docker network rm "$source_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$source_network" >/dev/null
          docker network create "$routing_network" >/dev/null
          docker run -d \
            --name "$target" \
            --network "$source_network" \
            alpine:3.20 sleep 300 >/dev/null
          docker network connect \
            --alias mypaas-port-18080 \
            "$routing_network" \
            "$target"

          ready=false
          for _ in $(seq 1 20); do
            if docker run --rm --network "$routing_network" alpine:3.20 \
              ping -c 1 -W 1 mypaas-port-18080 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != "true" ]]; then
            docker inspect "$target"
            docker network inspect "$routing_network"
            exit 1
          fi

      - name: Run isolated Podman compatibility smoke
        run: bash scripts/ci_podman_compat_isolated.sh
