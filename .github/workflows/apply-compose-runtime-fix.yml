name: Apply compose runtime fix

on:
  push:
    branches:
      - fix/compose-runtime-parity
    paths:
      - devtools/apply_compose_runtime_fix.py
      - .github/workflows/apply-compose-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[compose-runtime-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compose-runtime-parity
          fetch-depth: 0
      - name: Apply integration changes
        run: |
          python3 devtools/apply_compose_runtime_fix.py
          gofmt -w backend/internal/deployment/service.go backend/internal/deployment/compose_runtime.go backend/internal/deployment/compose_runtime_test.go backend/internal/container/compose_runtime.go backend/internal/container/compose_runtime_test.go
      - name: Verify backend
        working-directory: backend
        run: go test ./...
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md backend/internal/deployment/service.go backend/internal/deployment/compose_runtime.go backend/internal/deployment/compose_runtime_test.go backend/internal/container/compose_runtime.go backend/internal/container/compose_runtime_test.go
          git commit -m "fix(compose): align runtime behavior with image deploys [compose-runtime-applied]"
          git push origin HEAD:fix/compose-runtime-parity
