name: Apply compose runtime fix

on:
  push:
    branches:
      - fix/compose-runtime-parity
    paths:
      - devtools/compose-runtime.patch
      - .github/workflows/apply-compose-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[compose-runtime-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compose-runtime-parity
          fetch-depth: 0
      - name: Apply integration patch
        run: |
          git apply --check devtools/compose-runtime.patch
          git apply devtools/compose-runtime.patch
          gofmt -w backend/internal/deployment/service.go
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/deployment/service.go
          git commit -m "fix(compose): gate routes on runtime readiness [compose-runtime-applied]"
          git push origin HEAD:fix/compose-runtime-parity
