name: Apply compose context integration

on:
  push:
    branches:
      - fix/compose-runtime-parity
    paths:
      - .github/workflows/fix-compose-context.yml

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[compose-context-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compose-runtime-parity
          fetch-depth: 0
      - name: Pass deployment context to env injection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/deployment/service.go')
          text = path.read_text()
          old = 'injectComposeEnvFile(layout.OverrideFile, layout.EnvFile)'
          new = 'injectComposeEnvFile(ctx, layout.OverrideFile, layout.EnvFile)'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 injectComposeEnvFile call sites, found {count}')
          path.write_text(text.replace(old, new))
          PY
          gofmt -w backend/internal/deployment/service.go backend/internal/deployment/compose_runtime.go backend/internal/deployment/compose_runtime_test.go
      - name: Verify backend
        working-directory: backend
        run: go test ./...
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/deployment/service.go backend/internal/deployment/compose_runtime.go backend/internal/deployment/compose_runtime_test.go
          git commit -m "fix(deployment): propagate context to compose env injection [compose-context-applied]"
          git push origin HEAD:fix/compose-runtime-parity
