name: Agent Create Project remediation

on:
  push:
    branches: ["agent/create-project-detection-handoff"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/agent-create-project-remediate.py
      - name: Format Go
        run: gofmt -w backend/internal/project/service.go backend/internal/project/static_frontend.go backend/internal/project/static_frontend_test.go
      - name: Backend tests
        working-directory: backend
        run: go test ./internal/project
      - name: Frontend setup
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Frontend validation
        working-directory: frontend
        run: |
          pnpm test -- --run
          pnpm check
          pnpm build
          pnpm audit:create
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git diff --cached --check
          git commit -m "fix: complete Create Project detection and agent handoff"
          git push
