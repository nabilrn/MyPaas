name: temp-updater-control-health

on:
  push:
    branches:
      - fix/updater-control-network-health

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/updater-control-network-health
          fetch-depth: 0

      - name: Patch updater health path
        run: |
          printf '%s' '  mVyaWZ5KQogICAgICAgIHNlbGYuYXNzZXJ0Tm90SW4oJ2h0dHA6Ly8xMjcuMC4wLjE6ODA4MC9yZWFkeScsIHZlcmlmeSkKJyc nCikK' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Validate scripts and regression contract
        run: |
          bash -n scripts/update-vm.sh
          bash -n scripts/verify-production.sh
          python3 scripts/update_release_safety_test.py
          python3 scripts/release_aware_update_test.py

      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-updater-control-health.yml
          git add scripts/update-vm.sh scripts/verify-production.sh scripts/update_release_safety_test.py
          git commit -m "fix(updater): qualify API through control network"
          git push origin HEAD:fix/updater-control-network-health
