name: New project visual simplification self-patch

on:
  push:
    branches:
      - contrib/new-project-visual-simplification
    paths:
      - .github/workflows/new-project-visual-simplification-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contrib/new-project-visual-simplification
          fetch-depth: 0
      - name: Apply visual simplification
        run: python scripts/apply_new_project_visual_simplification.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_new_project_visual_simplification.py
          rm .github/workflows/new-project-visual-simplification-self-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(project): simplify new project visual hierarchy"
          git push origin HEAD:contrib/new-project-visual-simplification
