name: Apply static CPU floor patch

on:
  push:
    branches:
      - fix/static-cpu-floor-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/static-cpu-floor-001

      - name: Apply bounded static CPU floor changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/internal/resourceprofile/profile.go": [
                  ("\t\tCPULimit: 0.10,", "\t\tCPULimit: 0.01,"),
              ],
              "backend/internal/settings/handler.go": [
                  ("if value < 0.10 || value > 32 {", "if value < 0.01 || value > 32 {"),
                  ("static CPU must be between 0.10 and 32 cores", "static CPU must be between 0.01 and 32 cores"),
              ],
              "frontend/src/routes/admin/settings/+page.svelte": [
                  ("profile_static_cpu_limit: 0.1,", "profile_static_cpu_limit: 0.01,"),
                  ("minimumMemory: 64, minimumCPU: 0.1 },", "minimumMemory: 64, minimumCPU: 0.01 },"),
                  ("numberError(settings.profile_static_cpu_limit, 0.1, 32, false, 'Use 0.10–32 CPU.')", "numberError(settings.profile_static_cpu_limit, 0.01, 32, false, 'Use 0.01–32 CPU.')"),
                  ("numericValue(data.profile_static_cpu_limit, 0.1)", "numericValue(data.profile_static_cpu_limit, 0.01)"),
              ],
              "frontend/src/routes/projects/new/+page.svelte": [
                  ("profile_static_cpu_limit ?? 0.1", "profile_static_cpu_limit ?? 0.01"),
              ],
              "frontend/src/lib/components/ProjectCombinedSettings.svelte": [
                  ("profile_static_cpu_limit ?? 0.1", "profile_static_cpu_limit ?? 0.01"),
              ],
              "frontend/src/lib/components/ProjectSettingsSection.svelte": [
                  ("profile_static_cpu_limit ?? 0.1", "profile_static_cpu_limit ?? 0.01"),
              ],
              "backend/internal/settings/handler_test.go": [
                  ('{name: "valid resource defaults", values: map[string]float64{"profile_static_memory_mb": 128, "profile_static_cpu_limit": 0.2, "profile_compose_main_memory_mb": 512, "profile_compose_main_cpu_limit": 0.5}},', '{name: "valid resource defaults", values: map[string]float64{"profile_static_memory_mb": 128, "profile_static_cpu_limit": 0.01, "profile_compose_main_memory_mb": 512, "profile_compose_main_cpu_limit": 0.5}},\n\t\t{name: "static CPU below floor", values: map[string]float64{"profile_static_cpu_limit": 0.009}, wantErr: true},'),
              ],
              "backend/internal/resourceprofile/profile_test.go": [
                  ("Static: {MemoryMB: 128, CPULimit: 0.25},", "Static: {MemoryMB: 64, CPULimit: 0.01},"),
                  ("if memory != 128 || cpu != 0.25 {", "if memory != 64 || cpu != 0.01 {"),
                  ("Resolve() = %d MB / %.2f CPU, want 128 MB / 0.25 CPU", "Resolve() = %d MB / %.2f CPU, want 64 MB / 0.01 CPU"),
                  ("Static: {MemoryMB: 32, CPULimit: 0.10},", "Static: {MemoryMB: 64, CPULimit: 0.009},"),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          stale = [
              "profile_static_cpu_limit ?? 0.1",
              "minimumMemory: 64, minimumCPU: 0.1 },",
              "numberError(settings.profile_static_cpu_limit, 0.1, 32",
              "numericValue(data.profile_static_cpu_limit, 0.1)",
              "static CPU must be between 0.10 and 32 cores",
          ]
          roots = [Path("backend"), Path("frontend")]
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for needle in stale:
                      if needle in text:
                          raise SystemExit(f"stale static CPU floor reference {needle!r} remains in {path}")
          PY

          gofmt -w backend/internal/resourceprofile/profile.go backend/internal/resourceprofile/profile_test.go backend/internal/settings/handler.go backend/internal/settings/handler_test.go

      - name: Run targeted backend regression tests
        working-directory: backend
        run: go test ./internal/resourceprofile ./internal/settings

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-static-cpu-floor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend .github/workflows/temp-static-cpu-floor.yml
          git commit -m "fix(resources): allow 0.01 cpu for static projects"
          git push origin HEAD:fix/static-cpu-floor-001
