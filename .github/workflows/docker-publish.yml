name: Build and Publish Docker Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve immutable release identity
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid CI head SHA: $RELEASE_SHA" >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "rollback_tag=rollback-${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify checkout matches tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.sha }}"

      - name: Detect frontend-only release
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          frontend_only=false
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t changed_files < <(git diff --name-only HEAD^ HEAD)
            if (( ${#changed_files[@]} > 0 )); then
              frontend_only=true
              for path in "${changed_files[@]}"; do
                if [[ "$path" != frontend/* ]]; then
                  frontend_only=false
                  break
                fi
              done
            fi
          fi
          printf 'Release files:\n'
          git diff --name-only HEAD^ HEAD 2>/dev/null || true
          echo "frontend_only=$frontend_only" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        if: steps.scope.outputs.frontend_only != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/nabilrn/mypaas-api:latest
            ${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.release.outputs.sha }}
            ${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.release.outputs.rollback_tag }}

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:latest
            ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:${{ steps.release.outputs.sha }}
            ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:${{ steps.release.outputs.rollback_tag }}
