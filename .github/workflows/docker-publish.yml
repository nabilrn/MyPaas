name: Build and Publish Docker Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_full:
        description: "Build both API and dashboard images from the current main commit"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve immutable release identity
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $RELEASE_SHA" >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "rollback_tag=rollback-${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.sha }}"

      - name: Detect frontend-only release
        id: scope
        shell: bash
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full || false }}
        run: |
          set -euo pipefail
          frontend_only=false
          parent_sha=""

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            parent_sha="$(git rev-parse HEAD^)"
          fi

          if [[ "$FORCE_FULL" != "true" ]]; then
            if [[ -n "$parent_sha" ]]; then
              mapfile -t changed_files < <(git diff --name-only "$parent_sha" HEAD)
              if (( ${#changed_files[@]} > 0 )); then
                frontend_only=true
                for path in "${changed_files[@]}"; do
                  if [[ "$path" != frontend/* ]]; then
                    frontend_only=false
                    break
                  fi
                done
              fi
            fi
          fi

          printf 'Release files:\n'
          if [[ -n "$parent_sha" ]]; then
            git diff --name-only "$parent_sha" HEAD
          fi
          echo "force_full=$FORCE_FULL"
          echo "frontend_only=$frontend_only" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$parent_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve reusable API image
        id: api-reuse
        if: steps.scope.outputs.frontend_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_sha=""

          while read -r candidate; do
            [[ -n "$candidate" ]] || continue

            safe=true
            while read -r path; do
              [[ -n "$path" ]] || continue
              if [[ "$path" != frontend/* ]]; then
                safe=false
                break
              fi
            done < <(git diff --name-only "$candidate" HEAD)

            if [[ "$safe" != "true" ]]; then
              break
            fi

            source_image="${REGISTRY}/nabilrn/mypaas-api:$candidate"
            if docker buildx imagetools inspect "$source_image" >/dev/null 2>&1; then
              source_sha="$candidate"
              break
            fi
          done < <(git rev-list --first-parent HEAD^)

          if [[ -n "$source_sha" ]]; then
            echo "Reusing immutable API image from $source_sha"
          else
            echo "No safe reusable API image found; rebuilding API"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        if: steps.scope.outputs.frontend_only != 'true' || steps.api-reuse.outputs.source_sha == ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/nabilrn/mypaas-api:latest
            ${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.release.outputs.sha }}
            ${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.release.outputs.rollback_tag }}

      - name: Alias reusable API image for frontend-only revision
        if: steps.scope.outputs.frontend_only == 'true' && steps.api-reuse.outputs.source_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          source_image="${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.api-reuse.outputs.source_sha }}"
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.release.outputs.sha }}" \
            --tag "${{ env.REGISTRY }}/nabilrn/mypaas-api:${{ steps.release.outputs.rollback_tag }}" \
            "$source_image"

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:latest
            ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:${{ steps.release.outputs.sha }}
            ${{ env.REGISTRY }}/nabilrn/mypaas-dashboard:${{ steps.release.outputs.rollback_tag }}
