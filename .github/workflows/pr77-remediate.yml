name: PR77 branch remediation

on:
  push:
    branches:
      - agent/create-project-audit-remediation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch registry port interaction and audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('frontend/src/routes/projects/new/+page.svelte')
          text = page.read_text()

          replacements = [
              (
                  "{#if form.deployMode !== 'auto' && form.deployMode !== 'static' && !form.appPort}",
                  "{#if form.deployMode !== 'auto' && form.deployMode !== 'static' && (form.sourceType === 'registry' || !form.appPort)}",
              ),
              (
                  "{#if form.deployMode !== 'static' && form.appPort}",
                  "{#if form.sourceType === 'git' && form.deployMode !== 'static' && form.appPort}",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old}')
              text = text.replace(old, new, 1)
          page.write_text(text)

          audit = Path('frontend/playwright/audit/create-project-audit.mjs')
          audit_text = audit.read_text()
          old = """async function fillContainerPort(page, port) {\n\tconst input = page.getByRole('spinbutton', { name: 'Container port' }).first();\n\tawait input.waitFor({ state: 'visible', timeout: 20_000 });\n\tawait input.fill(port);\n\tawait page.waitForTimeout(150);\n}\n"""
          new = """async function fillContainerPort(page, port) {\n\tconst input = page.getByRole('spinbutton', { name: 'Container port' }).first();\n\tawait input.waitFor({ state: 'visible', timeout: 20_000 });\n\tconst expectedPort = String(port);\n\tawait input.fill('');\n\tawait input.pressSequentially(expectedPort, { delay: 25 });\n\tawait input.waitFor({ state: 'visible', timeout: 20_000 });\n\tconst actualPort = await input.inputValue();\n\tif (actualPort !== expectedPort) {\n\t\tthrow new Error(`Container port input lost the typed value: expected ${expectedPort}, got ${actualPort}`);\n\t}\n\tawait page.waitForTimeout(150);\n}\n"""
          if audit_text.count(old) != 1:
              raise SystemExit('expected exactly one fillContainerPort helper')
          audit.write_text(audit_text.replace(old, new, 1))

          workflow = Path('.github/workflows/pr77-remediate.yml')
          workflow.unlink()
          PY

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/routes/projects/new/+page.svelte frontend/playwright/audit/create-project-audit.mjs .github/workflows/pr77-remediate.yml
          git commit -m "fix: keep registry port input stable"
          git push origin HEAD:agent/create-project-audit-remediation
