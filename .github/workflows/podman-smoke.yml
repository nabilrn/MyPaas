name: Podman compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-cli-on-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker explicit network-alias contract
        run: |
          set -euo pipefail
          source_network=mypaas-ci-docker-source
          routing_network=mypaas-ci-docker-routing
          target=mypaas-ci-docker-alias-target
          cleanup() {
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$routing_network" >/dev/null 2>&1 || true
            docker network rm "$source_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$source_network" >/dev/null
          docker network create "$routing_network" >/dev/null
          docker run -d \
            --name "$target" \
            --network "$source_network" \
            alpine:3.20 sleep 300 >/dev/null
          docker network connect \
            --alias mypaas-port-18080 \
            "$routing_network" \
            "$target"

          # Test exactly the contract MyPaaS needs here: the explicit alias on
          # the secondary user-defined network resolves and reaches the live
          # container. HTTP behavior is exercised separately in the Podman+Caddy
          # smoke below.
          ready=false
          for _ in $(seq 1 20); do
            if docker run --rm --network "$routing_network" alpine:3.20 \
              ping -c 1 -W 1 mypaas-port-18080 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != "true" ]]; then
            docker inspect "$target"
            docker network inspect "$routing_network"
            exit 1
          fi

      - name: Install rootful Podman socket
        run: bash scripts/ci_setup_rootful_podman.sh

      - name: Verify Docker CLI is backed by packaged Podman
        run: |
          set -euo pipefail
          clean_env=(env PATH=/usr/bin:/usr/sbin:/bin:/sbin HOME=/root XDG_RUNTIME_DIR=/run/user/0 CONTAINERS_CONF_OVERRIDE=/tmp/mypaas-containers.conf)
          expected="$(sudo "${clean_env[@]}" /usr/bin/podman version --format '{{.Client.Version}}')"
          actual="$(sudo docker version --format '{{.Server.Version}}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Docker compatibility socket server version $actual does not match packaged Podman $expected" >&2
            sudo docker version >&2 || true
            sudo "${clean_env[@]}" /usr/bin/podman version >&2 || true
            exit 1
          fi
          conmon_path="$(sudo "${clean_env[@]}" /usr/bin/podman info --format '{{.Host.Conmon.Path}}')"
          runtime_path="$(sudo "${clean_env[@]}" /usr/bin/podman info --format '{{.Host.OCIRuntime.Path}}')"
          test "$conmon_path" = "/usr/bin/conmon"
          test "$runtime_path" = "/usr/bin/crun"
          sudo docker version | tee /tmp/mypaas-docker-version.txt
          grep -q 'Podman Engine' /tmp/mypaas-docker-version.txt
          sudo docker compose version

      - name: Run MyPaaS Podman compatibility smoke
        run: sudo -E env PATH=/usr/bin:/usr/sbin:/bin:/sbin HOME=/root XDG_RUNTIME_DIR=/run/user/0 bash scripts/podman_compat_smoke.sh
