name: Podman compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-cli-on-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker explicit network-alias contract
        run: |
          set -euo pipefail
          source_network=mypaas-ci-docker-source
          routing_network=mypaas-ci-docker-routing
          target=mypaas-ci-docker-alias-target
          cleanup() {
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$routing_network" >/dev/null 2>&1 || true
            docker network rm "$source_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$source_network" >/dev/null
          docker network create "$routing_network" >/dev/null
          docker run -d \
            --name "$target" \
            --network "$source_network" \
            alpine:3.20 sleep 300 >/dev/null
          docker network connect \
            --alias mypaas-port-18080 \
            "$routing_network" \
            "$target"

          # Test exactly the contract MyPaaS needs here: the explicit alias on
          # the secondary user-defined network resolves and reaches the live
          # container. HTTP behavior is exercised separately in the Podman+Caddy
          # smoke below.
          ready=false
          for _ in $(seq 1 20); do
            if docker run --rm --network "$routing_network" alpine:3.20 \
              ping -c 1 -W 1 mypaas-port-18080 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != "true" ]]; then
            docker inspect "$target"
            docker network inspect "$routing_network"
            exit 1
          fi

      - name: Run isolated Podman compatibility smoke
        run: bash scripts/ci_podman_compat_isolated.sh
