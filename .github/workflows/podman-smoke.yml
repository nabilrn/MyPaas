name: Podman compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-cli-on-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker short-ID DNS contract
        run: |
          set -euo pipefail
          network=mypaas-ci-docker-dns
          target=mypaas-ci-docker-dns-target
          cleanup() {
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          id="$(docker run -d --name "$target" --network "$network" alpine:3.20 sh -c 'mkdir -p /www && printf "docker-dns-ok\n" >/www/index.html && httpd -f -p 8080 -h /www')"
          short_id="${id:0:12}"
          docker run --rm --network "$network" alpine:3.20 \
            wget -qO- "http://${short_id}:8080" | grep -q '^docker-dns-ok$'

      - name: Install rootful Podman socket
        run: |
          sudo apt-get update
          sudo apt-get install -y podman catatonit
          sudo systemctl stop docker.service docker.socket || true
          sudo rm -f /var/run/docker.sock
          sudo systemctl enable --now podman.socket
          sudo ln -s /run/podman/podman.sock /var/run/docker.sock

      - name: Verify Docker CLI is backed by Podman
        run: |
          sudo docker version | tee /tmp/mypaas-docker-version.txt
          grep -q 'Podman Engine' /tmp/mypaas-docker-version.txt
          sudo docker compose version

      - name: Run MyPaaS Podman compatibility smoke
        run: sudo -E bash scripts/podman_compat_smoke.sh
