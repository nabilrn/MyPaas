name: Apply New Project UX Refactor

on:
  push:
    branches:
      - contrib/new-project-ux-refactor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contrib/new-project-ux-refactor
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-new-project-ux-refactor.py
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-new-project-ux-refactor.yml scripts/apply-new-project-ux-refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/routes/projects/new/+page.svelte
          git commit -m "refactor: simplify new project creation flow [new-project-ux-applied]"
          git push origin HEAD:contrib/new-project-ux-refactor
