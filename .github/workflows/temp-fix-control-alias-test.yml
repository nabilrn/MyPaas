name: temp-fix-control-alias-test

on:
  push:
    branches:
      - fix/control-plane-service-aliases

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/control-plane-service-aliases
      - name: Update legacy network-shape assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/install_wizard_test.py')
          text = path.read_text(encoding='utf-8')
          old = '''        self.assertIn("- control", postgres)\n        self.assertIn("- projects", postgres)\n        self.assertNotIn("- routing", postgres)\n        self.assertIn("- control", api)\n        self.assertNotIn("- projects", api)\n        self.assertNotIn("- routing", api)\n        self.assertIn("- control", caddy)\n        self.assertIn("- routing", caddy)\n        self.assertNotIn("- projects", caddy)\n'''
          new = '''        self.assertIn("networks:\\n      control:", postgres)\n        self.assertIn("projects:", postgres)\n        self.assertNotIn("routing:", postgres)\n        self.assertIn("networks:\\n      control:", api)\n        self.assertNotIn("projects:", api)\n        self.assertNotIn("routing:", api)\n        self.assertIn("networks:\\n      control:", caddy)\n        self.assertIn("routing:", caddy)\n        self.assertNotIn("projects:", caddy)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected legacy assertion block once, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate regression suite and Compose
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p '*_test.py'
          docker compose -f docker-compose.prod.yml --env-file .env.example config >/dev/null
      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-fix-control-alias-test.yml
          git add scripts/install_wizard_test.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(network): accept explicit alias mapping"
          git push origin HEAD:fix/control-plane-service-aliases
